<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Brasileira — Simulador</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- Barra Superior -->
<header class="top-bar">
    <div class="profile-icon" onclick="abrirPerfil()">👤</div>
    <h1 id="page-title">Vida Brasileira</h1>
    <div class="time-display" id="game-time">19:38 — 20/10/2026</div>
</header>

<!-- Conteúdo Principal -->
<main id="main-content">
    <div class="tela-inicial" id="tela-inicio">
        <h2>Bem-vindo ao Vida Brasileira!</h2>
        <p>Escolha uma opção na barra inferior para começar sua jornada.</p>
    </div>
</main>

<!-- Barra de Status — Sinais de Vida -->
<section class="status-bar">
    <div class="status-item">
        <span>❤️ Saúde</span>
        <div class="barra"><div class="barra-preenchida" id="barra-saude" style="width:100%">100%</div></div>
    </div>
    <div class="status-item">
        <span>😊 Felicidade</span>
        <div class="barra"><div class="barra-preenchida" id="barra-felicidade" style="width:80%">80%</div></div>
    </div>
    <div class="status-item">
        <span>✨ Aparência</span>
        <div class="barra"><div class="barra-preenchida" id="barra-aparencia" style="width:75%">75%</div></div>
    </div>
    <div class="status-item">
        <span>🧠 Inteligência</span>
        <div class="barra"><div class="barra-preenchida" id="barra-inteligencia" style="width:50%">50%</div></div>
    </div>
</section>

<!-- Navegação Principal -->
<nav class="bottom-nav">
    <button class="nav-btn" id="btn-carreira" onclick="mostrarTela('carreira')">💼<br><small>Carreira</small></button>
    <button class="nav-btn" id="btn-celular" onclick="mostrarTela('celular')">📱<br><small>Celular</small></button>
    <button class="nav-btn" id="btn-tempo" onclick="pularTempo()">⏩<br><small>Tempo</small></button>
    <button class="nav-btn" id="btn-familia" onclick="mostrarTela('familia')">👨‍👩‍👧<br><small>Família</small></button>
    <button class="nav-btn" id="btn-mais" onclick="mostrarTela('mais')">⚙️<br><small>Mais</small></button>
</nav>

<script src="script.js"></script>
</body>
</html>
